<!-- frontend_test/ui/auth.html -->
<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Little Paws - Auth Test</title>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../css/styles.css" />
        <link rel="stylesheet" href="../css/auth.css" />

        <script src="../js/script.js" defer></script>
        <script src="../js/auth.js" defer></script>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-container">
                <div class="logo"><i class="bx bxs-dog"></i> <span>Little Paws</span></div>
                <nav class="test-nav">
                    <a href="auth.html" class="nav-link active">Auth Test</a>
                    <a href="seed-data.html" class="nav-link">Seed Data</a>
                    <span class="nav-link" id="signed-in-username"></span>
                </nav>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                    <i id="theme-icon" class="bx bx-moon"></i>
                </button>
            </div>
        </header>

        <main id="app-content" class="container">
            <div class="auth-wrapper">
                <!-- Khu vực Form Đăng Nhập -->
                <div class="auth-card">
                    <h2>Đăng nhập</h2>
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-identity">Tài khoản / Email / SĐT</label>
                            <input
                                type="text"
                                id="login-identity"
                                required
                                placeholder="Nhập thông tin tài khoản"
                            />
                        </div>
                        <div class="form-group">
                            <label for="login-password">Mật khẩu</label>
                            <input
                                type="password"
                                id="login-password"
                                required
                                placeholder="••••••••"
                            />
                        </div>
                        <button type="submit" class="btn-submit">Xác nhận Đăng nhập</button>
                    </form>
                </div>

                <!-- Khu vực Form Đăng Ký -->
                <div class="auth-card">
                    <h2>Đăng ký tài khoản</h2>
                    <form id="register-form">
                        <div class="form-group">
                            <label for="reg-username">Tên đăng nhập</label>
                            <input
                                type="text"
                                id="reg-username"
                                required
                                placeholder="username_test"
                            />
                        </div>
                        <div class="form-group">
                            <label for="reg-fullName">Họ và tên</label>
                            <input
                                type="text"
                                id="reg-fullName"
                                required
                                placeholder="Nguyen Van A"
                            />
                        </div>
                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input
                                type="email"
                                id="reg-email"
                                placeholder="example@gmail.com"
                            />
                        </div>
                        <div class="form-group">
                            <label for="reg-phone">Số điện thoại</label>
                            <input type="text" id="reg-phone" placeholder="0901234567" />
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Mật khẩu</label>
                            <input
                                type="password"
                                id="reg-password"
                                required
                                placeholder="••••••••"
                            />
                        </div>
                        <div class="form-group">
                            <label for="reg-confirmPassword">Nhập lại mật khẩu</label>
                            <input
                                type="password"
                                id="reg-confirmPassword"
                                required
                                placeholder="••••••••"
                            />
                        </div>
                        <button type="submit" class="btn-submit">Đăng ký ngay</button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Khu vực Container chứa các thông báo nổi -->
        <div id="toast-container"></div>

        <!-- Khu vực Cấu trúc khung Modal hiển thị thông tin -->
        <div id="info-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="modal-title" class="modal-title">Thông báo</h3>
                    <button id="modal-close-btn" class="modal-close">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Little Paws - Pet Tracking Application</p>
        </footer>
    </body>
</html>
