<!-- frontend_test/ui/template.html -->
<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Little Paws</title>

        <!-- Các thư viện dùng chung -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <link
            href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
            rel="stylesheet"
        />

        <!-- CSS & JS Global -->
        <link rel="stylesheet" href="../css/styles.css" />
        <script src="../js/script.js" defer></script>

        <!-- Import CSS/JS riêng của từng trang -->
        <!-- <link rel="stylesheet" href="../css/ten-trang.css"> -->
        <!-- <script src="../js/ten-trang.js" defer></script> -->
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-container">
                <div
                    class="logo"
                    style="
                        display: flex;
                        flex-direction: row;
                        align-items: center;
                        justify-content: center;
                    "
                >
                    <i class="bx bx-paw-print"></i> <span>Little Paws</span>
                </div>

                <nav class="test-nav">
                    <a href="auth.html" class="nav-link active">Auth Test</a>
                    <a href="seed-data.html" class="nav-link">Seed Data</a>
                    <span class="nav-link" id="signed-in-username"></span>
                </nav>

                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                    <i id="theme-icon" class="bx bx-moon"></i>
                </button>
            </div>
        </header>

        <!-- Nơi chứa nội dung chính của từng trang -->
        <main id="app-content" class="container">
            <!-- Nội dung ví dụ -->
            <h1 style="margin-top: 2rem">Trang chủ Test</h1>
            <p>Nội dung các trang sẽ được thay thế vào đây...</p>
        </main>

        <!-- Khu vực Container chứa các thông báo nổi -->
        <div id="toast-container"></div>

        <!-- Khu vực Cấu trúc khung Modal hiển thị thông tin -->
        <div id="info-modal" class="modal-overlay">
            <div class="modal-container">
                <div class="modal-header">
                    <h3 id="modal-title" class="modal-title">Thông báo</h3>
                    <button id="modal-close-btn" class="modal-close">&times;</button>
                </div>
                <div id="modal-body" class="modal-body"></div>
            </div>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Little Paws - Pet Tracking Application</p>
        </footer>
    </body>
</html>
